services:
  - type: web
    name: lecture-processor
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://lecture-processor-1.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: USE_MINIFIED_JS_ASSETS
        value: "1"
      - key: STUDY_PLAN_V2
        value: "1"
      # Keep disabled until OAuth and Firebase worker are configured; see docs/google-calendar-setup.md.
      - key: GOOGLE_CALENDAR_ENABLED
        value: "0"
      - key: BOOK_STUDIO_ENABLED
        value: "1"
      - key: BOOK_STORAGE_URL
        sync: false
      - key: BOOK_STORAGE_KEY
        sync: false
      - key: BOOK_STORAGE_BUCKET
        value: "book-images"
      - key: WEB_THREADS
        value: "4"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_DSN_BACKEND
        sync: false
      - key: SENTRY_DSN_FRONTEND
        sync: false
