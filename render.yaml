services:
  - type: web
    name: lecture-processor
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://lecture-processor-1.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: USE_MINIFIED_JS_ASSETS
        value: "1"
      - key: STUDY_PLAN_V2
        value: "1"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_DSN_BACKEND
        sync: false
      - key: SENTRY_DSN_FRONTEND
        sync: false
