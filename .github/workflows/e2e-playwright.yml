name: E2E Playwright

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright-shards:
    name: Playwright shard (${{ matrix.shard }}/4)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    env:
      SENTRY_DSN_BACKEND: ""
      SENTRY_DSN_FRONTEND: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.3"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browser
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload shard Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Verify real planner API lifecycle with isolated synthetic data
        id: stateful
        if: matrix.shard == 1
        env:
          PLANNER_STATEFUL_FIXTURE: "1"
          USE_MINIFIED_JS_ASSETS: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-stateful-report
        run: npx playwright test e2e/planner-stateful.spec.js e2e/study-flow-stateful.spec.js --workers=1 --output=stateful-test-results

      - name: Upload stateful Playwright report
        if: always() && matrix.shard == 1 && steps.stateful.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stateful-report
          path: |
            playwright-stateful-report
            stateful-test-results
          if-no-files-found: ignore

  playwright-e2e:
    name: Playwright E2E Smoke
    if: always()
    needs: playwright-shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.playwright-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "Playwright shards did not all succeed: $SHARDS_RESULT" >&2
            exit 1
          fi
