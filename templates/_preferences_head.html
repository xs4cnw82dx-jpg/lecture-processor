<script src="{{ url_for('static', filename='js/credit-utils.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
{# Dutch catalogs load only for Dutch; i18n.js fetches them on a later switch. #}
<script nonce="{{ csp_nonce }}" data-i18n-catalogs="{{ url_for('static', filename='js/i18n-catalog.js') }} {{ url_for('static', filename='js/i18n-supplement.js') }} {{ url_for('static', filename='js/i18n-dynamic.js') }} {{ url_for('static', filename='js/i18n-dynamic-learning.js') }} {{ url_for('static', filename='js/i18n-dynamic-tools.js') }}">
(function () {
  var script = document.currentScript;
  var urls = String((script && script.getAttribute('data-i18n-catalogs')) || '').split(' ').filter(Boolean);
  window.LectureI18nCatalogUrls = urls;
  var dutch = false;
  try { dutch = JSON.parse(window.localStorage.getItem('lp-preferences') || '{}').language === 'nl'; } catch (_error) { dutch = false; }
  // Parser-inserted deferred scripts keep their order before i18n.js.
  if (dutch) urls.forEach(function (src) { document.write('<script src="' + src + '" defer><\/script>'); });
})();
</script>
<script src="{{ url_for('static', filename='js/i18n.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/preferences.js') }}" defer></script>
