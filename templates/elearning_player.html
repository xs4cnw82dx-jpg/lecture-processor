<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <title>xPEDitie Pijn · Lecture Processor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/xped-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/elearning-player.css') }}">
</head>
<body class="el-player-body xped-surface-scope" data-share-token="{{ share_token }}" data-xped-theme="xped-warm-sand" data-text-scale="md">
  <header class="el-player-header">
    <div class="el-player-header-inner">
      <button type="button" class="el-player-brand" id="el-player-home-btn" aria-label="Return to start page">
        <img src="{{ url_for('static', filename='images/xped/logo_nl.svg') }}" alt="xPEDitie Pijn">
        <span id="el-player-course-label">xPEDitie Pijn</span>
      </button>

      <div class="el-player-controls">
        <button type="button" class="xped-btn xped-btn-ghost" id="el-player-map-btn" hidden>Route</button>
        <div class="el-dd el-comfort-dd" id="el-comfort-dd">
          <button type="button" class="el-dd-trigger el-comfort-trigger" id="el-comfort-trigger" aria-controls="el-comfort-menu" aria-expanded="false" aria-label="Leescomfort">
            <span>Aa</span>
          </button>
          <div class="el-dd-menu is-right el-comfort-menu" id="el-comfort-menu">
            <div class="el-comfort-section">
              <span class="el-comfort-label" id="el-comfort-size-lbl">Text size</span>
              <div class="el-text-scale-group" role="group" aria-labelledby="el-comfort-size-lbl">
                <button type="button" data-scale="sm" aria-label="Smaller text">A-</button>
                <button type="button" data-scale="md" class="is-active" aria-label="Default text">A</button>
                <button type="button" data-scale="lg" aria-label="Larger text">A+</button>
              </div>
            </div>
            <div class="el-comfort-section">
              <span class="el-comfort-label" id="el-comfort-theme-lbl">Appearance</span>
              <div class="el-theme-toggle-group" role="group" aria-labelledby="el-comfort-theme-lbl">
                <button type="button" data-theme-pref="default" class="is-active" id="el-theme-warm-btn">Warm</button>
                <button type="button" data-theme-pref="high-contrast" id="el-theme-contrast-btn">Contrast</button>
              </div>
            </div>
          </div>
        </div>
        <div id="el-player-lang-host"></div>
      </div>
    </div>
    <progress class="el-player-progress-bar" id="el-player-progress-fill" max="100" value="0" aria-label="Voortgang"></progress>
  </header>

  <main class="el-player-main" id="el-player-main" tabindex="-1">
    <div class="xped-card el-player-state" id="el-player-loading" role="status">
      <h1>xPEDitie Pijn</h1>
      <p>Even laden…</p>
    </div>
  </main>

  <dialog class="el-dialog" id="el-player-route-dialog" closedby="any" aria-labelledby="el-player-route-title">
    <div class="el-route-dialog-header">
      <h2 id="el-player-route-title">xPEDitie Route</h2>
      <form method="dialog"><button type="submit" class="el-icon-btn" aria-label="Close">×</button></form>
    </div>
    <div class="el-route-dialog-body" id="el-player-route-body"></div>
  </dialog>

  <script src="{{ url_for('static', filename=elearning_model_js) }}"></script>
  <script src="{{ url_for('static', filename=elearning_icons_js) }}"></script>
  <script src="{{ url_for('static', filename=elearning_route_map_js) }}"></script>
  <script src="{{ url_for('static', filename=elearning_blocks_js) }}"></script>
  <script src="{{ url_for('static', filename=elearning_player_js) }}"></script>
</body>
</html>
