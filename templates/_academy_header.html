<a class="skip-link" href="#main-content">Skip to content</a>
<header class="academy-header">
  <nav class="academy-nav" aria-label="Studio navigation">
    <a class="academy-brand" href="/" aria-label="xPEDitie Pijn Studio">
      <img src="{{ url_for('static', filename='brand/books/xped/mark-white.png') }}" width="41" height="23" alt="">
      <span class="academy-brand-name"><span>xPEDitie Pijn</span><strong>Studio</strong></span>
    </a>
    {% if academy_show_account|default(true) %}
      <div class="academy-nav-actions">
        <details class="academy-preferences">
          <summary>Settings</summary>
          <div class="academy-preferences-panel">
            <label for="academy-language">Interface language</label>
            <select id="academy-language" translate="no"><option value="en">English</option><option value="nl">Nederlands</option></select>
            <label for="academy-theme">Appearance</label>
            <select id="academy-theme"><option value="light">Light</option><option value="dark">Dark</option></select>
          </div>
        </details>
        <button type="button" class="btn small" id="academy-signout" hidden>Sign out</button>
      </div>
    {% endif %}
  </nav>
</header>
