{# Shared line icons for the Academy workspace. #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' %}<rect x="3" y="3" width="8" height="10" rx="2"/><rect x="14" y="3" width="7" height="6" rx="2"/><rect x="3" y="16" width="8" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/>
{%- elif name == 'map' %}<path d="m3 5 6-2 6 2 6-2v15l-6 3-6-3-6 2zM9 3v15m6-13v16"/>
{%- elif name == 'chart' %}<path d="M4 3v17h17M8 15v-4m5 4V7m5 8v-6"/>
{%- elif name == 'translate' %}<path d="M3 5h12M9 3v2m4 0c-1.3 5.5-4.3 9-9 11m2-8c1 3.1 3.3 5.8 6.3 7.8M14 21l3.5-9 3.5 9m-6-3h5"/>
{%- elif name == 'team' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v2"/>
{%- elif name == 'settings' %}<path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h6m4 0h8"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="18" r="2"/>
{%- elif name == 'menu' %}<path d="M3 6h18M3 12h18M3 18h18"/>
{%- elif name == 'rail' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m7-11-3 3 3 3"/>
{%- elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>
{%- elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{%- elif name == 'down' %}<path d="m6 9 6 6 6-6"/>
{%- elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == 'privacy' %}<path d="m12 3 8 3v6c0 4.5-3.6 7.6-8 9-4.4-1.4-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == 'logout' %}<path d="M10 4H5v16h5m5-13 5 5-5 5M8 12h12"/>
{%- elif name == 'user' %}<circle cx="12" cy="8" r="3.3"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/>
{%- elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
{%- elif name == 'moon' %}<path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10z"/>
{%- elif name == 'arrow' %}<path d="M4 12h15m-6-6 6 6-6 6"/>
{%- endif %}</svg>
{%- endmacro %}
