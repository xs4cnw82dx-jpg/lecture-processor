<dialog class="el-dialog" id="el-create-dialog" closedby="any" aria-labelledby="el-create-dialog-title">
    <div class="el-dialog-header">
      <h2 id="el-create-dialog-title">{{ tr("Create New Expedition") }}</h2>
      <form method="dialog"><button type="submit" class="el-icon-btn" aria-label="{{ tr("Close") }}">×</button></form>
    </div>
    <form id="el-create-form" class="el-dialog-body">
      <div class="el-field">
        <label for="el-new-title">{{ tr("Expedition Title") }}</label>
        <input type="text" id="el-new-title" placeholder="{{ tr("e.g. Understanding pain") }}" maxlength="200" required autofocus>
      </div>
      <div class="el-field">
        <label for="el-new-lang">{{ tr("Primary Authoring Language") }}</label>
        <select data-app-select id="el-new-lang">
          <option value="nl">Nederlands (NL)</option>
          {% if show_english %}<option value="en">English (EN)</option>{% endif %}
          <option value="de">Deutsch (DE)</option>
        </select>
      </div>
      <div class="el-field">
        <label for="el-new-template">{{ tr("Starting Structure") }}</label>
        <select data-app-select id="el-new-template">
          <option value="blank">{{ tr("Blank expedition") }}</option>
          <option value="bps-skeleton">{{ tr("Three-station outline") }}</option>
          <option value="showcase">{{ tr("Interactive example") }}</option>
        </select>
      </div>
      <div class="el-template-preview" id="el-template-preview" aria-live="polite"></div>
      <span class="sr-only" id="el-create-progress" role="status"></span>
      <div class="el-dash-actions">
        <p class="field-error" id="el-create-error" role="alert" hidden></p>
        <button type="button" class="btn" id="el-create-cancel">{{ tr("Cancel") }}</button>
        <button type="submit" class="btn primary" id="el-create-confirm">{{ tr("Create & Open Builder") }}</button>
      </div>
    </form>
  </dialog>

  <dialog class="el-dialog" id="el-import-dialog" closedby="any" aria-labelledby="el-import-dialog-title">
    <div class="el-dialog-header">
      <h2 id="el-import-dialog-title">{{ tr("Import Expedition Preview") }}</h2>
      <form method="dialog"><button type="submit" class="el-icon-btn" aria-label="{{ tr("Close") }}">×</button></form>
    </div>
    <div class="el-dialog-body">
      <div id="el-import-summary" class="el-template-preview" aria-live="polite"></div>
      <div class="el-dash-actions">
        <p class="field-error" id="el-import-error" role="alert" hidden></p>
        <button type="button" class="btn" id="el-import-cancel">{{ tr("Cancel") }}</button>
        <button type="button" class="btn primary" id="el-import-confirm">{{ tr("Import & Open Builder") }}</button>
      </div>
    </div>
  </dialog>

  <dialog class="el-dialog" id="el-delete-dialog" closedby="any" aria-labelledby="el-delete-dialog-title">
    <div class="el-dialog-header">
      <h2 id="el-delete-dialog-title">{{ tr("Delete Expedition?") }}</h2>
      <form method="dialog"><button type="submit" class="el-icon-btn" aria-label="{{ tr("Close") }}">×</button></form>
    </div>
    <div class="el-dialog-body">
      <p id="el-delete-dialog-msg" translate="no"></p>
      <p>{{ tr("This removes the expedition and deactivates its public share link.") }}</p>
      <div class="el-dash-actions">
        <p class="field-error" id="el-delete-error" role="alert" hidden></p>
        <button type="button" class="btn" id="el-delete-cancel">{{ tr("Cancel") }}</button>
        <button type="button" class="btn danger" id="el-delete-confirm">{{ tr("Delete") }}</button>
      </div>
    </div>
  </dialog>
